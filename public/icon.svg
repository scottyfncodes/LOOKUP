<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sky" cx="0.5" cy="0.35" r="0.85">
      <stop offset="0" stop-color="#1b2a55"/>
      <stop offset="0.6" stop-color="#0d1530"/>
      <stop offset="1" stop-color="#070a12"/>
    </radialGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fff6d8" stop-opacity=".9"/>
      <stop offset="0.35" stop-color="#ffd66b" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffd66b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".8"/>
      <stop offset="0.4" stop-color="#a9c4ff" stop-opacity=".25"/>
      <stop offset="1" stop-color="#a9c4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="milky" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8fa6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8fa6ff" stop-opacity=".10"/>
      <stop offset="1" stop-color="#8fa6ff" stop-opacity="0"/>
    </linearGradient>
    <symbol id="spark" viewBox="-10 -10 20 20">
      <path d="M0 -10 C 1 -2, 2 -1, 10 0 C 2 1, 1 2, 0 10 C -1 2, -2 1, -10 0 C -2 -1, -1 -2, 0 -10 Z"/>
    </symbol>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <path d="M-40 470 C 120 330, 330 230, 560 40 L 560 140 C 340 300, 150 400, -40 560 Z" fill="url(#milky)"/>
  <!-- faint field stars -->
  <g fill="#dfe6ff">
    <circle cx="52" cy="70" r="2" opacity=".55"/><circle cx="118" cy="42" r="1.6" opacity=".45"/>
    <circle cx="214" cy="60" r="1.8" opacity=".5"/><circle cx="470" cy="60" r="2.2" opacity=".55"/>
    <circle cx="468" cy="250" r="1.7" opacity=".45"/><circle cx="40" cy="250" r="1.8" opacity=".5"/>
    <circle cx="150" cy="300" r="1.5" opacity=".4"/><circle cx="330" cy="330" r="1.6" opacity=".4"/>
    <circle cx="430" cy="372" r="2" opacity=".5"/><circle cx="88" cy="160" r="1.4" opacity=".4"/>
    <circle cx="300" cy="40" r="1.4" opacity=".4"/><circle cx="250" cy="300" r="1.4" opacity=".35"/>
  </g>
  <!-- Big Dipper -->
  <g fill="none" stroke="#b9c9ff" stroke-opacity=".55" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M86 128 L 160 150 L 214 192 L 268 236 L 290 312 L 398 330 L 414 246 L 268 236"/>
  </g>
  <g fill="#ffffff">
    <circle cx="86" cy="128" r="22" fill="url(#glowB)"/><circle cx="86" cy="128" r="6"/>
    <circle cx="160" cy="150" r="22" fill="url(#glowB)"/><circle cx="160" cy="150" r="6.5"/>
    <circle cx="214" cy="192" r="20" fill="url(#glowB)"/><circle cx="214" cy="192" r="5.5"/>
    <circle cx="268" cy="236" r="18" fill="url(#glowB)"/><circle cx="268" cy="236" r="5"/>
    <circle cx="290" cy="312" r="22" fill="url(#glowB)"/><circle cx="290" cy="312" r="6.5"/>
    <circle cx="398" cy="330" r="22" fill="url(#glowB)"/><circle cx="398" cy="330" r="6.5"/>
    <circle cx="414" cy="246" r="24" fill="url(#glowB)"/><circle cx="414" cy="246" r="7"/>
  </g>
  <!-- Polaris: the gold guide star the pointers lead to -->
  <path d="M414 246 L 404 168 L 388 96" fill="none" stroke="#ffd66b" stroke-opacity=".45" stroke-width="2.6" stroke-dasharray="2 12" stroke-linecap="round"/>
  <circle cx="380" cy="86" r="62" fill="url(#glow)"/>
  <use href="#spark" x="344" y="50" width="72" height="72" fill="#ffd66b"/>
  <circle cx="380" cy="86" r="6" fill="#fff6d8"/>
  <!-- horizon -->
  <path d="M0 440 C 90 410, 160 418, 236 432 C 320 448, 400 414, 512 404 L 512 512 L 0 512 Z" fill="#0a0f1d"/>
  <path d="M0 440 C 90 410, 160 418, 236 432 C 320 448, 400 414, 512 404" fill="none" stroke="#2a3a6a" stroke-width="3" opacity=".8"/>
</svg>
